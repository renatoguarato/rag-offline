[project]
name = "rag-offline"
version = "1.0.0"
description = "Production-ready offline RAG application with multi-tenant isolation"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite==0.20.0",
    "alembic==1.14.0",
    "chromadb==0.6.3",
    "fastapi==0.115.0",
    "httpx==0.27.0",
    "numpy==1.26.4",
    "ollama==0.4.1",
    "onnxruntime==1.23.2",
    "pydantic==2.10.0",
    "pydantic-settings==2.6.0",
    "pypdf==5.1.0",
    "python-docx==1.1.2",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.12",
    "sqlalchemy[asyncio]==2.0.35",
    "uvicorn[standard]==0.32.0",
]

[dependency-groups]
dev = [
    "pyright==1.1.390",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "ruff==0.8.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", ".venv", "build", "dist", "chroma_db"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = ["B008", "B904", "N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
include = ["app", "tests", "evaluation"]
exclude = ["**/__pycache__", "venv", ".venv", "build", "dist", "chroma_db"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = "warning"
reportUnknownVariableType = "warning"
reportUnknownArgumentType = "warning"
reportUnusedFunction = "none"
